services:
  user-service:
    build:
      context: ../backend/services/user-service
      dockerfile: Dockerfile
    container_name: legalflow-user-service
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_BASE_URL: http://legalflow-keycloak:8080
      KEYCLOAK_REALM: legalflow
      KEYCLOAK_ADMIN_CLIENT_ID: legalflow-user-service
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-bfBzYFD6AFfXsB234w7l1k5zhTFHZd1g}
      CLIENT_SERVICE_URL: http://legalflow-client-service:8081
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://legalflow-keycloak:8080/realms/legalflow/protocol/openid-connect/certs
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8080/realms/legalflow
    ports:
      - "8090:8090"
    restart: unless-stopped

  gateway:
    depends_on:
      - user-service
    environment:
      SPRING_CLOUD_GATEWAY_ROUTES_0_ID: user-service-route
      SPRING_CLOUD_GATEWAY_ROUTES_0_URI: http://legalflow-user-service:8090
      SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0: Path=/api/users/**